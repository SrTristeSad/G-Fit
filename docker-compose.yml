name: gfit
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gfit
      POSTGRES_USER: gfit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env}
    volumes:
      - gfit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gfit -d gfit"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_HOST: db
      DB_USER: gfit
      DB_NAME: gfit
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    expose: ["3001"]
  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"
volumes:
  gfit-postgres:
