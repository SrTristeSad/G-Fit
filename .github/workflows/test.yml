name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: API tests
        working-directory: api
        run: npm test
      - name: Build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: test_only_not_for_production
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: docker compose config --quiet
      - name: Validate standard Docker Compose without mock
        env:
          POSTGRES_PASSWORD: test_only_not_for_production
        run: docker compose -f docker-compose.yml config --quiet
      - name: Smoke test with PostgreSQL and HTTP
        env:
          POSTGRES_PASSWORD: test_only_not_for_production
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          set -euo pipefail
          docker compose up -d --build
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then docker compose logs --no-color; exit 1; fi
          curl -fsS -c /tmp/gfit-cookie-1 -H 'Content-Type: application/json' \
            -d '{"name":"Professor Teste","email":"teste1@example.com","password":"senha-para-testar-123"}' \
            http://localhost:8080/api/auth/register | grep -q '"teacher"'
          curl -fsS -b /tmp/gfit-cookie-1 -H 'Content-Type: application/json' \
            -d '{"name":"Aluno de Teste"}' \
            http://localhost:8080/api/students | grep -q '"student"'
          curl -fsS -b /tmp/gfit-cookie-1 http://localhost:8080/api/students | grep -q 'Aluno de Teste'
          curl -fsS -c /tmp/gfit-cookie-2 -H 'Content-Type: application/json' \
            -d '{"name":"Segundo Professor","email":"teste2@example.com","password":"senha-segunda-conta-123"}' \
            http://localhost:8080/api/auth/register | grep -q '"teacher"'
          curl -fsS -b /tmp/gfit-cookie-2 http://localhost:8080/api/students | grep -q '"students":\[\]'
          curl -fsS -b /tmp/gfit-cookie-1 -X POST http://localhost:8080/api/auth/logout | grep -q '"ok":true'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/gfit-cookie-1 http://localhost:8080/api/students)
          test "$code" = "401"
      - name: Administrator provisioning and role/limit integration tests
        env:
          POSTGRES_PASSWORD: test_only_not_for_production
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          set -euo pipefail
          docker compose exec -T api node src/bootstrap-admin.js admin@example.com > /tmp/gfit-admin.txt
          export ADMIN_PASSWORD
          ADMIN_PASSWORD="$(sed -n 's/^Password: //p' /tmp/gfit-admin.txt)"
          test -n "$ADMIN_PASSWORD"
          node api/test/e2e.mjs
          # O rate limiter em memória não deve fazer uma suíte bloquear a outra.
          # Reiniciar somente a API também valida migrações repetidas e preservação do banco.
          docker compose restart api
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          node api/test/workouts-e2e.mjs
          node api/test/classes-e2e.mjs
          node api/test/reports-e2e.mjs
          node api/test/assessments-e2e.mjs
          # Exportações usam autenticação própria; mantenha o limite real de login ativo.
          docker compose restart api
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          node api/test/student-privacy-e2e.mjs
          node api/test/erasure-requests-e2e.mjs
          # Segunda janela isolada de autenticação para os testes extensos do Pix.
          docker compose restart api
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          node api/test/pix-e2e.mjs
          if docker compose exec -T api node src/bootstrap-admin.js outro@example.com > /dev/null 2>&1; then
            echo "ERROR: second admin bootstrap should be blocked"
            exit 1
          fi
      - name: Encrypted backup, tamper detection and isolated restore
        env:
          POSTGRES_PASSWORD: test_only_not_for_production
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/gfit-ci-backup.key"
          other_key="$RUNNER_TEMP/gfit-ci-wrong.key"
          backup="$RUNNER_TEMP/gfit-ci.gfitbak"
          modified="$RUNNER_TEMP/gfit-ci-tampered.gfitbak"
          node scripts/generate-backup-key.mjs "$key"
          if node scripts/generate-backup-key.mjs "$key"; then
            echo "ERROR: existing backup key was overwritten"
            exit 1
          fi
          node scripts/generate-backup-key.mjs "$other_key"
          node scripts/backup.mjs "$backup" "$key"
          test -s "$backup"
          node scripts/verify-backup.mjs "$backup" "$key"
          if node scripts/verify-backup.mjs "$backup" "$other_key"; then
            echo "ERROR: wrong decryption key was accepted"
            exit 1
          fi
          node -e 'const fs=require("node:fs");const b=fs.readFileSync(process.argv[1]);b[40]^=1;fs.writeFileSync(process.argv[2],b);' "$backup" "$modified"
          if node scripts/verify-backup.mjs "$modified" "$key"; then
            echo "ERROR: tampered backup passed GCM authentication"
            exit 1
          fi
          node scripts/restore-check.mjs "$backup" "$key"
          original_count="$(docker compose exec -T db psql -U gfit -d gfit -At -c 'SELECT count(*) FROM teachers' | tr -d '\r\n')"
          test "$original_count" -ge 2
          rm -f "$modified" "$backup" "$other_key" "$key"
      - name: aaPanel installer and offline ZIP package security tests
        run: |
          npm test
          npm run release:zip -- --version 0.1.1
          test -s releases/gfit-0.1.1.zip
      - name: aaPanel full installation with disposable PostgreSQL
        run: |
          set -euo pipefail
          name="gfit-aapanel-ci-${GITHUB_RUN_ID}"
          docker run -d --name "$name" --rm \
            -e POSTGRES_DB=gfit_install \
            -e POSTGRES_USER=gfit_install \
            -e POSTGRES_PASSWORD=ci_aapanel_database_password \
            -p 127.0.0.1:15432:5432 postgres:16-alpine
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if docker exec "$name" pg_isready -U gfit_install -d gfit_install >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          node aapanel/test/installer-e2e.mjs
          rm -f .aapanel.env
      - name: Stop test services
        if: always()
        env:
          POSTGRES_PASSWORD: test_only_not_for_production
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: docker compose down
